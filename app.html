<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimal-ui">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#7d9b7d">
<meta name="description" content="Мой дневник привычек и тренировок">
<title>Дневник</title>
<style>
body{margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#EBECE7,#F0F1EB);font-family:system-ui,-apple-system;color:#3a3a35;}
.loader{text-align:center;}
.logo{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(90deg,#7d9b7d,#a8a882);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 30px rgba(93,110,93,.15);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
.text{font-size:16px;color:#8a8a80;margin-bottom:8px;}
.subtext{font-size:13px;color:#dfe0d8;}
</style>
</head>
<body>
<div class="loader">
<div class="logo">📔</div>
<div class="text">Загрузка дневника...</div>
<div class="subtext">Подожди секунду</div>
</div>

<script>
// Подставляем путь к основному файлу
// Если файлы в одной папке, то это сработает
setTimeout(() => {
  // Пытаемся открыть индекс в полноэкранном режиме
  window.location.href = 'index.html';
}, 500);
</script>
</body>
</html>
